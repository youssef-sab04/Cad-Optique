spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cadoptique
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      secret-key: CHANGE_ME_SECRET_KEY
      expiration: 86400000
  cors:
    origins: http://localhost:3000,http://localhost:8080
server:
  port: 8080